name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  adapters:
    name: Adapters and extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The Python reference suite stays until the final task removes the Python core; it is the executable oracle
      # for the port, not a second runtime the product needs.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 -I -m unittest discover -s tests -t .
      - run: node --test board-view/*.test.mjs
      - run: bash -n hooks/*.sh
