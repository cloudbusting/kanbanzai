name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  validate:
    name: Plugin and version
    runs-on: ubuntu-latest
    env:
      # The version the README's compatibility table names. Raise both together.
      CLAUDE_CODE_VERSION: "2.1.312"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - run: claude plugin validate --strict .

  build:
    name: Build the five archives
    needs: [test, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go run ./tools/release -check -version "$GITHUB_REF_NAME"
      - run: go run ./tools/release -version "$GITHUB_REF_NAME" -out dist
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*

  publish:
    name: Attach the binaries to the release
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "Kanbanzai ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
