name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -timeout 20m ./...

  validate:
    name: Plugin and version
    runs-on: ubuntu-latest
    env:
      # The version the README's compatibility table names. Raise both together.
      CLAUDE_CODE_VERSION: "2.1.312"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - run: claude plugin validate --strict .

  build:
    name: Build the five archives and the .vsix
    needs: [test, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go run ./tools/release -check -version "$GITHUB_REF_NAME"
      - run: go run ./tools/release -version "$GITHUB_REF_NAME" -out dist -bins bins
      - run: go run ./tools/vsix -bin bins -o "dist/kanbanzai-board-${GITHUB_REF_NAME#v}.vsix"
      - run: go run ./tools/release -scan bins
      # The .vsix is what the marketplace jobs publish: scan the file itself, unpacked into a new empty folder.
      - name: Scan the unpacked .vsix
        run: |
          mkdir "$RUNNER_TEMP/vsix-unpacked"
          unzip -q "dist/kanbanzai-board-${GITHUB_REF_NAME#v}.vsix" -d "$RUNNER_TEMP/vsix-unpacked"
          go run ./tools/release -scan "$RUNNER_TEMP/vsix-unpacked"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*

  publish:
    name: Attach the binaries to the release
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "Kanbanzai ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  # The marketplace jobs run after the GitHub release, so a marketplace failure never hides it, and they are
  # separate, so one failing does not stop the other. They publish the .vsix the build job made and scanned; they
  # never build one. A marketplace version cannot be replaced: if one of these fails, re-run only the failed job
  # (nothing was published), and fix a wrong published version with the next patch tag, never by moving this one.
  # @vscode/vsce and ovsx are pinned; raise them on purpose.
  # Open VSX trusted publishing, the same idea: the namespace owner registered this repository and this workflow file
  # as a trusted publisher, and ovsx swaps the job's OIDC token for a short-lived publishing token. There is no stored
  # secret, and there must never be an OVSX_PAT: a token in the environment takes precedence and turns this off.
  open-vsx:
    name: Publish the .vsix to Open VSX
    needs: [build, publish]
    if: github.repository == 'cloudbusting/kanbanzai'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          set -eu
          VSIX="$(ls dist/*.vsix)"
          test "$(printf '%s\n' "$VSIX" | wc -l)" -eq 1
          npx --yes ovsx@1.4.0 publish "$VSIX" --trusted-publishing --skip-duplicate

  # Visual Studio Marketplace trusted publishing: GitHub proves which repository and workflow this is with a
  # short-lived OIDC token, and the publisher's trusted-publishing policy accepts it. There is no stored secret.
  vs-marketplace:
    name: Publish the .vsix to the Visual Studio Marketplace
    needs: [build, publish]
    if: github.repository == 'cloudbusting/kanbanzai'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          set -eu
          VSIX="$(ls dist/*.vsix)"
          test "$(printf '%s\n' "$VSIX" | wc -l)" -eq 1
          npx --yes @vscode/vsce@4.1.1 publish --oidc --packagePath "$VSIX"
