# An opt-in example: brief schemas for the task, bug and change types.
#
# Copy templates/task.md, bug.md and change.md into your project (`kanbanzai template --example bug > templates/bug.md`),
# then add the [schemas.*] tables below to .kanbanzai/config.toml and give each type `template` and `schema` lines.
# The [[types]] entries here show those lines: edit your existing entries for task, bug and change rather than
# repeating them (a repeated type key is refused). A type with no `schema` keeps the project's current brief rules;
# nothing here applies until you opt in. See docs/types.md.

[[types]]
key = "task"
label = "Task"
prefix = "TASK"
template = "templates/task.md"
schema = "task"

[[types]]
key = "bug"
label = "Bug"
prefix = "BUG"
template = "templates/bug.md"
schema = "bug"

[[types]]
key = "change"
label = "Change"
prefix = "CHANGE"
template = "templates/change.md"
schema = "change"

[schemas.task]
required_fields = ["Stage", "Updated", "Next action", "Where"]
optional_fields = ["Done", "ADR", "Held", "Gate", "Needs"]
required_sections = ["Goal", "Acceptance checks", "Deploy", "Tasks", "Docs", "Decisions", "Progress", "Out of scope", "Risk", "Comments"]
optional_sections = ["Design", "Questions"]
repeatable_sections = []
section_order = ["Goal", "Acceptance checks", "Deploy", "Tasks", "Design", "Docs", "Decisions", "Progress", "Out of scope", "Risk", "Questions", "Comments"]
final_section = "Comments"

[schemas.bug]
required_fields = ["Stage", "Updated", "Next action", "Where"]
optional_fields = ["Done", "ADR", "Held", "Gate", "Needs"]
required_sections = ["Goal", "Reproduction", "Expected", "Actual", "Acceptance checks", "Deploy", "Tasks", "Docs", "Decisions", "Progress", "Out of scope", "Risk", "Comments"]
optional_sections = ["Design", "Questions"]
repeatable_sections = []
section_order = ["Goal", "Reproduction", "Expected", "Actual", "Acceptance checks", "Deploy", "Tasks", "Design", "Docs", "Decisions", "Progress", "Out of scope", "Risk", "Questions", "Comments"]
final_section = "Comments"

[schemas.change]
required_fields = ["Stage", "Updated", "Next action", "Where"]
optional_fields = ["Done", "ADR", "Held", "Gate", "Needs"]
required_sections = ["Goal", "Before", "After", "Acceptance checks", "Deploy", "Tasks", "Docs", "Decisions", "Progress", "Out of scope", "Risk", "Comments"]
optional_sections = ["Design", "Questions"]
repeatable_sections = []
section_order = ["Goal", "Before", "After", "Acceptance checks", "Deploy", "Tasks", "Design", "Docs", "Decisions", "Progress", "Out of scope", "Risk", "Questions", "Comments"]
final_section = "Comments"
