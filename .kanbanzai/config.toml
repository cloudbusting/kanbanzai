# Kanbanzai's own board. The flow below is written out in full (`kanbanzai workflow export` wrote it; change it with
# `kanbanzai workflow validate|plan|apply`, not by hand-editing the columns). It is the shipped flow plus gates:
#   Todo      a card gate, until Designed: a card waits there until every card in its `Needs:` line is designed
#             (a card is designed after the cards it depends on are)
#   Designed  a card gate, until Done: a designed card is not built until every card it needs is Done
#   QA-approved  the owner gate: nothing ships until the owner's approval is recorded (`kanbanzai gate pass`)
# A card with no `Needs:` line is never held by the first two. `kanbanzai gate status` lists every card at a gate.
#
# This repository develops Kanbanzai itself: the Python core, the editor extension in board-view/, and the Claude
# Code and OpenCode adapters. The project skills in .claude/skills/ are local development rules; they are not
# shipped to users. The shipped skills in skills/ are the product.
#
# Intake: `/kanbanzai-triage` is this repository's front door; the shipped `/triage` still writes the card.
#
# The steps below wire the repository's own skills into the shipped flow:
#   design  extends the shipped design step with the local-only architecture and contract rules
#   build   extends the shipped build step with the code, test and security rules
#   check   runs the repository's QA skill as its check
#   deploy-qa packages the extension and both plugin bundles and proves them in throwaway projects
#   ship    publishes an owner-approved release from the packaged commit

config_version = 1

[project]
owner = "the owner"      # the person the skills address and whose decisions they ask for
context = ["README.md"]  # read first by every Kanbanzai skill
worktree = "../worktrees/kanbanzai/{id}"

# More you can set (see Kanbanzai's defaults/config.toml for every key):
#   [project]  prefix, work, claims, numbers, worktree, context = ["rules file", ...]
#   [flow]     wip_limit, pull_order
#   [steps.check]  skill = "your-skill", extend = ["your-extension"], checks = ["your-test-skill"]

# The flow of this project, as `kanbanzai workflow export` wrote it.
# Edit it, then `kanbanzai workflow validate --file FILE` and `kanbanzai workflow plan --file FILE`.
# A flow file replaces the project's [flow], [[columns]] and [steps.*] tables.

[flow]
wip_limit = 5
stale_days = 7
move_grace_minutes = 10.0
pull_order = ["checked", "built", "designed", "todo"]

[[columns]]
key = "todo"
label = "Todo"
words = ["todo"]
folder = "1-open"
kind = "open"
started = "claimed"
next = "design"
settled_next = "build"
title = "DESIGNING"
settled_title = "BUILDING"
gate = "card"
gate_until = "designed"

[[columns]]
key = "designing"
label = "Designing"
words = ["designing"]
folder = "1-open"
kind = "open"
started = true
title = "DESIGNING"
lane = "Design"
doing = "design"

[[columns]]
key = "designed"
label = "Designed"
words = ["designed"]
folder = "1-open"
kind = "open"
started = true
next = "build"
title = "BUILDING"
worktree = true
lane = "Design"
gate = "card"
gate_until = "done"

[[columns]]
key = "building"
label = "Building"
words = ["building"]
folder = "1-open"
kind = "open"
started = true
title = "BUILDING"
worktree = true
lane = "Build"
doing = "build"

[[columns]]
key = "built"
label = "Built"
words = ["built"]
folder = "1-open"
kind = "open"
started = true
next = "check"
title = "CHECKING"
worktree = true
lane = "Build"

[[columns]]
key = "checking"
label = "Checking"
words = ["checking"]
folder = "1-open"
kind = "open"
started = true
title = "CHECKING"
worktree = true
lane = "Check"
doing = "check"

[[columns]]
key = "checked"
label = "Checked"
words = ["checked"]
folder = "1-open"
kind = "open"
started = true
next = "deploy-qa"
title = "IN QA"
worktree = true
lane = "Check"

[[columns]]
key = "in-qa"
label = "In QA"
words = ["in-qa"]
folder = "1-open"
kind = "open"
started = true
title = "IN QA"
worktree = true
lane = "QA"
doing = "deploy-qa"

[[columns]]
key = "qa-approved"
label = "QA-approved"
words = ["qa-approved"]
folder = "1-open"
kind = "open"
started = false
next = "ship"
title = "SHIPPING"
worktree = true
lane = "QA"
gate = "owner"

[[columns]]
key = "shipping"
label = "Shipping"
words = ["shipping"]
folder = "1-open"
kind = "open"
started = false
title = "SHIPPING"
worktree = true
lane = "Ship"
doing = "ship"

[[columns]]
key = "paused"
label = "Paused"
words = ["paused"]
folder = "x-paused"
kind = "parked"
started = false
title = "PAUSED"

[[columns]]
key = "done"
label = "Done"
words = ["done"]
folder = "10-done"
kind = "done"
started = false
title = "DONE"

[steps.build]
into = "built"
during = "building"
skill = "kanbanzai:build"
extend = ["kanbanzai-build"]
context = []
checks = []

[steps.check]
into = "checked"
during = "checking"
skill = "kanbanzai:check"
extend = []
context = []
checks = ["kanbanzai-qa"]

[steps.deploy-qa]
into = "qa-approved"
during = "in-qa"
skill = "kanbanzai-package"
extend = []
context = []
checks = []
skip_field = "Deploy"
skip_values = ["None"]

[steps.design]
into = "designed"
during = "designing"
skill = "kanbanzai:design"
extend = ["kanbanzai-design"]
context = []
checks = []

[steps.ship]
into = "done"
during = "shipping"
skill = "kanbanzai-release"
extend = []
context = []
checks = []
skip_field = "Deploy"
skip_values = ["None"]
