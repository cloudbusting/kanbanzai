# The simple preset (software-lite).

[preset]
name = "simple"
delivery_style = "software-lite"
version = 1
summary = "Todo, build, check, done on one branch per card in the one checkout: no design stage, QA or release step."
best_for = "A small project or a solo developer who wants a board without ceremony."
not_for = "Work that needs the owner's approval before a release, several cards in flight at once, or a design stage."

[project]
default_type = "task"

[[types]]
key = "task"
label = "Task"
prefix = "TASK"
description = "A piece of work"

[[types]]
key = "bug"
label = "Bug"
prefix = "BUG"
description = "Unexpected behaviour"
