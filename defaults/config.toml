# Kanbanzai's shipped workflow.
#
# A project's `.kanbanzai/config.toml` (in its main checkout) overrides this file key by key. Tables merge;
# a project that sets `[[columns]]` replaces the whole column list, and a project that sets a `[steps.<name>]`
# table replaces that step's keys it names. Paths are relative to the main checkout unless absolute;
# `{git_common}` is `git rev-parse --git-common-dir` (the `.git` every worktree shares).
#
# Each step has a Doing column (the step in progress) and a Done column (the last step finished, in the past tense):
# a session pulls a card from a Done column, moves it into the next step's Doing column, and moves it into that
# step's Done column when it finishes. Todo, Paused and Done are single columns. Each step names the column it moves
# a card into (`into`), the column it sits in while it runs (`during`) and the skill that does it.

# Version of this config contract (not the command's release version).
config_version = 1
# Exact unknown dotted paths to ignore, never a type/range/version bypass. Doctor warns for ignored keys.
# Column paths are columns.<setting>; step paths are steps.<name>.<setting>. Unknown tables may be listed whole.
# No wildcards. Unversioned files require `kanbanzai config upgrade` (preview), then `--apply` (backup/write).
config_allow_unknown = []

[project]
prefix = "W"                      # the LEGACY card id prefix; typed ids are the default (see [[types]] below)
digits = 2                        # integer 1 through 18; zero-padded to at least this many digits
owner = "the user"                # the person the skills address and whose decisions they ask for
home = ".kanbanzai"               # data home; config discovery stays at .kanbanzai/config.toml
work = ".kanbanzai/work"          # the cards: one brief per card, in git
state = ".kanbanzai/state"        # the leases (claims/) and the number ledger (numbers/): never in git
claims = ""                       # empty: <state>/claims
numbers = ""                      # empty: <state>/numbers
batches = ""                      # empty: <work>/batches
template = ""                     # empty: the template embedded in the kanbanzai binary
worktree = "../worktrees/{repo}/{id}"  # a card's worktree; {repo} is the main checkout's folder name (the project folder under worktrees/)
main_branch = "main"              # the branch the board and finished work live on
branch = "{id}"                   # a card's branch
batch_branch = "batch/{id}"       # a card's branch inside a batch
context = []                      # project files every Kanbanzai skill reads first (rules, where things stand)

# Issue types. Typed ids are the default: every card id is <TYPE-PREFIX>-<number>, or
# <project_key>-<TYPE-PREFIX>-<number> when a project key is set, and every type allocates from ONE global number
# sequence (BUG-07 is the seventh item overall, not the seventh bug). Type keys are lower-case; prefixes are
# upper-case. project.prefix is the LEGACY prefix: a card called <prefix>-NN stays valid, is not rewritten, and moves
# to done like any other card. A project opts out of typed ids with `types = []`, which restores the single-prefix
# shape and its <prefix>.json ledger. See docs/types.md.
default_type = "task"             # the type used when `kanbanzai number` names none
project_key = ""                  # optional upper-case component, e.g. KANZ for KANZ-BUG-07
# Each type may also set template = "templates/bug.md", colour = "#C43B3B" and icon = "bug"; colour is #rrggbb,
# icon is a local symbolic name, never a URL.

[[types]]
key = "task"
label = "Task"
prefix = "TASK"
description = "A piece of work"

[[types]]
key = "bug"
label = "Bug"
prefix = "BUG"
description = "Unexpected behaviour"

[[types]]
key = "change"
label = "Change"
prefix = "CHANGE"
description = "A change to something that exists"

[[types]]
key = "spike"
label = "Spike"
prefix = "SPIKE"
description = "An investigation with a time box"

[[types]]
key = "chore"
label = "Chore"
prefix = "CHORE"
description = "Maintenance with no behaviour change"

[claims]
lease_minutes = 120               # positive finite minutes, <=153722867; heartbeat renews the lease
owner_env = "KANBANZAI_OWNER"     # set it to override the detected session label (KANBANZAI_OWNER is always read)

[flow]
wip_limit = 5                     # positive integer; started cards (a claimed Todo included) before the last started column
stale_days = 7                    # positive integer; unclaimed started card with no news this long is stale
move_grace_minutes = 10           # positive finite minutes, <=153722867; live claim still in Todo/Done this long is "claimed, not started"
pull_order = ["checked", "built", "designed", "todo"]   # furthest along first; interrupted cards before all
# How a card's change is kept apart from the board (`kanbanzai workspace <ID>` says what each mode asks of a card):
#   worktree  a git worktree and a branch per card (project.worktree, project.branch); parallel sessions are safe
#   branch    a branch per card in the one checkout; one card at a time (one HEAD); the card's brief rides its branch
#   shared    the one checkout, whatever branch it is on; no workspace record; parallel sessions share one tree
#   external  a workspace the host owns; a card records it as `Where: external <ref>`, which the audit trusts
isolation = "worktree"

# The columns, in the board's order. Keys:
#   key      the column's id, and the Stage word that puts a card in it (unless `words` says more)
#   label    its name on the board
#   words    the Stage words that mean this column (default: [key])
#   folder   the folder under <work> its briefs live in
#   kind     open (on the way; a blocked or waiting card stays here, its Held line says so), parked, done
#   started  true: counts against wip_limit; "claimed": counts only with a live claim (the first column)
#   next     the step a session does to a card in this column (absent: nothing; the card waits)
#   title    the session-title state while a session does that step
#   worktree true: a claimed card here must have a workspace record in the flow's isolation mode (its next step
#            changes files); under `shared` nothing is recorded, under `worktree` it is a worktree
#   lane     the step's name on the board, over its Doing and Done columns (empty: a column of its own)
#   gate     a gate holds a card at rest in this column until its condition holds; `move` will not take it
#            out while the gate is closed (`--force --reason` overrides). One of:
#              owner     the owner's approval is recorded (`kanbanzai gate pass ID --note "<their words>"`)
#              ci        a CI result is recorded as passed (`gate pass ID`); gate_name is an optional label
#              external  a named outside event is recorded (`gate pass ID`); gate_name is required (a store
#                        review, a release train)
#              date      the clock is on or past gate_after = "YYYY-MM-DD" (UTC); computed, never recorded
#              card      every card in the brief's `Needs:` line is in column gate_until or later (default: a done
#                        column); computed, never recorded
#            A gate goes on an open column that is not a Doing column. `waits_for_owner = true` is the older
#            spelling of `gate = "owner"`. Each type takes only its own keys: gate_name, gate_after, gate_until.
#   doing    a Doing column: the step in progress while a card is here (the step's `during` names the column back).
#            A card here with a live claim is being worked; with none (and no Held line) it is interrupted. A
#            project whose columns name no Doing column keeps the old reading: a claim on a Done column is the doing

[[columns]]
key = "todo"
label = "Todo"
folder = "1-open"
kind = "open"
started = "claimed"
next = "design"
settled_next = "build"           # a Todo card whose Next action says "settled" skips design
title = "DESIGNING"
settled_title = "BUILDING"

[[columns]]
key = "designing"
label = "Designing"
lane = "Design"
doing = "design"
folder = "1-open"
kind = "open"
started = true
title = "DESIGNING"

[[columns]]
key = "designed"
label = "Designed"
lane = "Design"
folder = "1-open"
kind = "open"
started = true
next = "build"
title = "BUILDING"
worktree = true

[[columns]]
key = "building"
label = "Building"
lane = "Build"
doing = "build"
folder = "1-open"
kind = "open"
started = true
title = "BUILDING"
worktree = true

[[columns]]
key = "built"
label = "Built"
lane = "Build"
folder = "1-open"
kind = "open"
started = true
next = "check"
title = "CHECKING"
worktree = true

[[columns]]
key = "checking"
label = "Checking"
lane = "Check"
doing = "check"
folder = "1-open"
kind = "open"
started = true
title = "CHECKING"
worktree = true

[[columns]]
key = "checked"
label = "Checked"
lane = "Check"
folder = "1-open"
kind = "open"
started = true
next = "deploy-qa"
title = "IN QA"
worktree = true

[[columns]]
key = "in-qa"
label = "In QA"
lane = "QA"
doing = "deploy-qa"
folder = "1-open"
kind = "open"
started = true
title = "IN QA"
worktree = true

[[columns]]
key = "qa-approved"
label = "QA-approved"
lane = "QA"
folder = "1-open"
kind = "open"
next = "ship"
title = "SHIPPING"
worktree = true
gate = "owner"                    # never moved on until the owner's approval is recorded (`kanbanzai gate pass`)

[[columns]]
key = "shipping"
label = "Shipping"
lane = "Ship"
doing = "ship"
folder = "1-open"
kind = "open"
title = "SHIPPING"
worktree = true

[[columns]]
key = "paused"
label = "Paused"
folder = "x-paused"
kind = "parked"
title = "PAUSED"

[[columns]]
key = "done"
label = "Done"
folder = "10-done"
kind = "done"
title = "DONE"

# The steps. Each moves a card into one column, and names:
#   skill    the skill that runs it ("kanbanzai:<name>" for Kanbanzai's own, or a project skill's name).
#            Empty: the project has no such step, and a card skips it (`kanbanzai step` says where to go).
#   extend   project skills the step also follows, at the points the step's skill names
#   context  project files the step reads before it starts
#   checks   (the check step) the project skills that make up the checks, run in order; empty: the project's
#            own tests, as its README or CLAUDE.md says, and the diff review
#   skip_field, skip_values   a card skips the step when its brief's skip_field (a head line such as
#            `- **Deploy:** None`, or a `## Deploy` section) starts with one of skip_values, case-insensitively.
#            Both or neither. A card that skips every remaining step closes. A step whose `into` is a done column
#            also closes the card

[steps.design]
into = "designed"
during = "designing"
skill = "kanbanzai:design"
extend = []
context = []

[steps.build]
into = "built"
during = "building"
skill = "kanbanzai:build"
extend = []
context = []

[steps.check]
into = "checked"
during = "checking"
skill = "kanbanzai:check"
checks = []
extend = []
context = []

[steps.deploy-qa]
into = "qa-approved"
during = "in-qa"
skill = ""                        # no deploy by default: a checked card closes (kanbanzai:do, the close)
extend = []
context = []
skip_field = "Deploy"            # a card whose Deploy is None ships nothing: it skips this step
skip_values = ["None"]

[steps.ship]
into = "done"
during = "shipping"
skill = ""
extend = []
context = []
skip_field = "Deploy"            # a card whose Deploy is None ships nothing: it skips this step
skip_values = ["None"]
